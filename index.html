<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ToDo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <h1 id="app-title">ToDo List</h1>

    <form id="new-task-form" class="new-task" aria-label="Add new task">
      <input id="new-task-input" type="text" placeholder="Add a new task..." aria-label="New task" required />
      <button type="submit" aria-label="Add task">Add</button>
    </form>

    <section class="todo-section" aria-live="polite">
      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

      <div class="controls">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="filter" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <div class="actions">
          <span id="count" class="count">0 items left</span>
          <button id="clear-completed" class="clear">Clear completed</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
